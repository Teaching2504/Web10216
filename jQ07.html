<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập jQuery 07 - Hiệu ứng Hover Dãy số</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .numbers-container {
            display: flex;
            align-items: center;
            background-color: #e2e8f0;
            padding: 10px 20px;
            border-radius: 4px;
            height: 80px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .num-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #555555;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        /* Hover effect bằng class hoặc jQuery animation */
        .num-item.active {
            font-size: 48px;
            font-weight: bold;
            color: #000000;
            transform: translateY(-5px);
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="numbers-container">
        <div class="num-item">1</div>
        <div class="num-item">2</div>
        <div class="num-item">3</div>
        <div class="num-item">4</div>
        <div class="num-item">5</div>
    </div>

    <a href="jquery.html" class="back-link">← Quay lại danh mục jQuery</a>

    <script>
        $(document).ready(function() {
            $('.num-item').hover(
                function() {
                    $(this).addClass('active');
                },
                function() {
                    $(this).removeClass('active');
                }
            );
        });
    </script>
</body>
</html>
