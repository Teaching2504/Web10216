<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò chơi quay số - Lắc xúc xắc</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        .container {
            width: 820px;
            margin: 15px auto;
            border: 2px solid #0000cd;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Banner */
        .banner {
            background-color: #4a7c29;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #0000cd;
        }

        .banner-title {
            color: #ffff00;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .banner-title:hover {
            color: #ff0000;
            font-size: 36px;
        }

        /* Nav horizontal */
        nav {
            background-color: #0000cd;
            padding: 8px 15px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            color: #ffea00;
            background-color: #00008b;
            font-style: italic;
        }

        .nav-links a.active {
            text-decoration: underline;
        }

        /* Content Layout */
        .main-layout {
            display: flex;
            min-height: 420px;
        }

        /* Left Aside */
        .left-aside {
            width: 140px;
            background-color: #3b7a30;
            color: #ffffff;
            padding: 15px 10px;
            flex-shrink: 0;
            font-size: 12px;
        }

        .left-aside ul {
            list-style: none;
        }

        .left-aside li {
            margin-bottom: 8px;
        }

        .left-aside a {
            color: #ffffff;
            text-decoration: none;
        }

        .left-aside a:hover {
            text-decoration: underline;
        }

        /* Center Content */
        .center-content {
            flex-grow: 1;
            padding: 30px 15px;
            background-color: #ffffff;
            text-align: center;
        }

        .game-frame {
            border: 1px solid #7a92a5;
            background-color: #eeeeee;
            padding: 30px 20px;
            max-width: 440px;
            margin: 0 auto;
        }

        .dice-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Dice Face styling */
        .dice {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border: 2px solid #555;
            border-radius: 12px;
            box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.15);
            display: grid;
            padding: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            position: relative;
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: #222;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
        }

        .dot.red {
            background-color: #e53935;
            width: 18px;
            height: 18px;
        }

        .btn-spin {
            padding: 6px 16px;
            cursor: pointer;
            border: 1px solid #7a92a5;
            background-color: #efefef;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-spin:hover {
            background-color: #e0e0e0;
        }

        .total-display {
            margin-top: 25px;
            font-size: 38px;
            font-weight: bold;
            color: #d32f2f;
        }

        /* Right Aside */
        .right-aside {
            width: 150px;
            padding: 15px 10px;
            background-color: #ffffff;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .ad-box {
            border: 1px solid #81c784;
            background-color: #e8f5e9;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #2e7d32;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Footer */
        footer {
            background-color: #0000cd;
            color: #ffffff;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        .back-link {
            display: inline-block;
            margin: 15px auto;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-title">TRÒ CHƠI QUAY SỐ</div>
        </div>

        <!-- Menu ngang -->
        <nav>
            <ul class="nav-links">
                <li><a href="quayso_index.html">Trang chủ</a></li>
                <li><a href="quayso.html">Trò chơi quay số</a></li>
                <li><a href="xucxac.html" class="active">Trò chơi quay xucxac</a></li>
            </ul>
        </nav>

        <!-- Layout chính -->
        <div class="main-layout">
            <!-- Cột trái -->
            <div class="left-aside">
                <ul>
                    <li>• <a href="#">C#</a></li>
                    <li>• <a href="#">PHP & MySQL</a></li>
                    <li>• <a href="#">XML</a></li>
                    <li>• <a href="#">Java</a></li>
                    <li>• <a href="#">SQL Server</a></li>
                    <li>• <a href="#">ASP.NET</a></li>
                    <li>• <a href="#">Android</a></li>
                    <li>• <a href="#">Windows Phone</a></li>
                </ul>
            </div>

            <!-- Cột giữa -->
            <div class="center-content">
                <div class="game-frame">
                    <div class="dice-row">
                        <div class="dice" id="dice1"></div>
                        <div class="dice" id="dice2"></div>
                        <div class="dice" id="dice3"></div>
                    </div>

                    <button class="btn-spin" onclick="rollDice()">Quay số</button>

                    <div class="total-display" id="totalScore">9</div>
                </div>
            </div>

            <!-- Cột phải -->
            <div class="right-aside">
                <div class="ad-box">Vùng quảng cáo 1</div>
                <div class="ad-box">Vùng quảng cáo 2</div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            Bài thực hành Ứng dụng Web
        </footer>
    </div>

    <div style="text-align: center;">
        <a href="../nangcao.html" class="back-link">← Quay lại danh mục Nâng cao</a>
    </div>

    <script>
        // Cấu hình các vị trí chấm cho 6 mặt xúc xắc trên lưới 3x3 (hàng 1-3, cột 1-3)
        const dicePositions = {
            1: [[2, 2, true]], // chấm giữa màu đỏ
            2: [[1, 1], [3, 3]],
            3: [[1, 1], [2, 2, true], [3, 3]],
            4: [[1, 1], [1, 3], [3, 1], [3, 3]],
            5: [[1, 1], [1, 3], [2, 2, true], [3, 1], [3, 3]],
            6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
        };

        function renderDiceFace(elementId, value) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";

            const dots = dicePositions[value] || dicePositions[1];
            dots.forEach(pos => {
                const [row, col, isRed] = pos;
                const dot = document.createElement("div");
                dot.className = "dot" + (isRed ? " red" : "");
                dot.style.gridRow = row;
                dot.style.gridColumn = col;
                container.appendChild(dot);
            });
        }

        function rollDice() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const d3 = Math.floor(Math.random() * 6) + 1;

            renderDiceFace("dice1", d1);
            renderDiceFace("dice2", d2);
            renderDiceFace("dice3", d3);

            const total = d1 + d2 + d3;
            document.getElementById("totalScore").innerText = total;
        }

        // Khởi tạo ban đầu với các mặt 2, 1, 6 như trong hình đề bài
        renderDiceFace("dice1", 2);
        renderDiceFace("dice2", 1);
        renderDiceFace("dice3", 6);
    </script>
</body>
</html>
