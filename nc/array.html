<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc thư giãn - array.html</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        .wrapper {
            width: 800px;
            margin: 20px auto;
            border: 2px solid #0000aa;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Banner */
        .banner {
            background-color: #000000;
            color: #ffffff;
            height: 90px;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .banner-title {
            color: #ff0000;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px #440000;
        }

        .banner-sub {
            color: #ffff00;
            font-size: 13px;
        }

        /* Main Container */
        .content-area {
            display: flex;
            min-height: 400px;
            background-color: #000000;
        }

        /* Sidebar Left */
        .sidebar {
            width: 180px;
            padding: 20px 15px;
            background-color: #000000;
            border-right: 1px solid #222;
        }

        .nav-box {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-home {
            background-color: #00e5ff;
            color: #000000;
        }

        .nav-array {
            background-color: #ffff00;
            color: #000000;
        }

        .nav-box:hover {
            background-color: #ff007f;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff007f;
        }

        /* Main Stage */
        .main-stage {
            flex-grow: 1;
            padding: 25px 20px;
            color: #ffffff;
        }

        .array-table {
            width: 480px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffe4e6;
            border: 2px solid #000000;
        }

        .array-table th {
            background-color: #000000;
            color: #ffffff;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #000000;
        }

        .array-table td {
            border: 1px solid #000000;
            padding: 8px 10px;
            font-size: 13px;
            color: #000000;
        }

        .label-col {
            width: 140px;
            font-weight: bold;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 4px 6px;
            font-size: 13px;
            border: 1px solid #777;
            background-color: #ffffff;
            color: #000000;
        }

        button {
            padding: 4px 10px;
            cursor: pointer;
            border: 1px solid #555;
            background-color: #f1f5f9;
            font-size: 13px;
            border-radius: 2px;
        }

        button:hover {
            background-color: #e2e8f0;
        }

        /* Footer */
        .footer {
            background-color: #0000aa;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin: 15px auto;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-title">GÓC THƯ GIÃN</div>
            <div class="banner-sub">Môn học: Ứng dụng Web</div>
        </div>

        <div class="content-area">
            <!-- Sidebar -->
            <div class="sidebar">
                <a href="animal.html" class="nav-box nav-home">Trang chủ</a>
                <a href="array.html" class="nav-box nav-array">Thống kê mảng</a>
            </div>

            <!-- Main Stage -->
            <div class="main-stage">
                <table class="array-table">
                    <thead>
                        <tr>
                            <th colspan="2">THỐNG KÊ MẢNG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="label-col">Nhập số phần tử:</td>
                            <td><input type="number" id="numElements" value="10" min="1" max="100"></td>
                        </tr>
                        <tr>
                            <td><button onclick="generateArray()">Tạo mảng</button></td>
                            <td><input type="text" id="arrayDisplay" readonly></td>
                        </tr>
                        <tr>
                            <td><button onclick="removeEven()">Xóa các số chẵn</button></td>
                            <td>
                                <button onclick="rotateLeft()">Quay trái</button>
                                <button onclick="rotateRight()" style="margin-left: 8px;">Quay phải</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Nguyễn Thị Tuyết Trinh - 2351010216
        </div>
    </div>

    <div style="text-align: center;">
        <a href="../nangcao.html" class="back-link">← Quay lại danh mục Nâng cao</a>
    </div>

    <script>
        let arr = [];

        function updateDisplay() {
            document.getElementById("arrayDisplay").value = arr.join(", ");
        }

        // Tạo mảng ngẫu nhiên các số từ 1 - 50
        function generateArray() {
            const n = parseInt(document.getElementById("numElements").value);
            if (isNaN(n) || n <= 0) {
                alert("Vui lòng nhập số phần tử hợp lệ > 0");
                return;
            }

            arr = [];
            for (let i = 0; i < n; i++) {
                arr.push(Math.floor(Math.random() * 50) + 1);
            }
            updateDisplay();
        }

        // Xóa các số chẵn trong mảng
        function removeEven() {
            if (arr.length === 0) {
                alert("Vui lòng tạo mảng trước!");
                return;
            }
            arr = arr.filter(num => num % 2 !== 0);
            updateDisplay();
        }

        // Quay trái: phần tử đầu dời ra sau
        function rotateLeft() {
            if (arr.length <= 1) return;
            const first = arr.shift();
            arr.push(first);
            updateDisplay();
        }

        // Quay phải: phần tử cuối đưa lên đầu
        function rotateRight() {
            if (arr.length <= 1) return;
            const last = arr.pop();
            arr.unshift(last);
            updateDisplay();
        }

        // Tạo mảng mặc định khi mở trang
        generateArray();
    </script>
</body>
</html>
