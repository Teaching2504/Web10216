<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập JS 04 - Xử lý mảng số nguyên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            border: 1px solid #7a92a5;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-size: 14px;
        }

        .row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .row label {
            width: 140px;
        }

        .row input[type="number"] {
            width: 80px;
            padding: 4px 6px;
        }

        .btn-group {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid #7a92a5;
            background-color: #efefef;
            border-radius: 3px;
            font-size: 13px;
        }

        button:hover {
            background-color: #e2e2e2;
        }

        .display-line {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .display-line span.label {
            display: inline-block;
            width: 130px;
            font-weight: 500;
        }

        .display-line span.val {
            letter-spacing: 2px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <label for="numElements">Nhập số phần tử:</label>
            <input type="number" id="numElements" value="10" min="1" max="100">
        </div>

        <div class="btn-group">
            <button onclick="createRandomArray()">Tạo mảng</button>
            <button onclick="sortAscending()">Sắp xếp mảng tăng</button>
            <button onclick="sortDescending()">Sắp xếp mảng giảm</button>
        </div>

        <div class="display-line">
            <span class="label">Mảng ban đầu:</span>
            <span class="val" id="originArr"></span>
        </div>

        <div class="display-line">
            <span class="label">Mảng tăng dần:</span>
            <span class="val" id="ascArr"></span>
        </div>

        <div class="display-line">
            <span class="label">Mảng giảm dần:</span>
            <span class="val" id="descArr"></span>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="javascript.html" class="back-link">← Quay lại danh mục JavaScript</a>
    </div>

    <script>
        let arr = [];

        function createRandomArray() {
            const n = parseInt(document.getElementById("numElements").value);
            if (isNaN(n) || n <= 0) {
                alert("Vui lòng nhập số phần tử hợp lệ > 0");
                return;
            }

            arr = [];
            for (let i = 0; i < n; i++) {
                // Khởi tạo các số nguyên nhỏ hơn 50 (1 -> 49)
                arr.push(Math.floor(Math.random() * 49) + 1);
            }

            document.getElementById("originArr").innerText = arr.join(" ");
            document.getElementById("ascArr").innerText = "";
            document.getElementById("descArr").innerText = "";
        }

        function sortAscending() {
            if (arr.length === 0) {
                alert("Vui lòng tạo mảng trước!");
                return;
            }
            const sorted = [...arr].sort((a, b) => a - b);
            document.getElementById("ascArr").innerText = sorted.join(" ");
        }

        function sortDescending() {
            if (arr.length === 0) {
                alert("Vui lòng tạo mảng trước!");
                return;
            }
            const sorted = [...arr].sort((a, b) => b - a);
            document.getElementById("descArr").innerText = sorted.join(" ");
        }

        // Tạo mảng mặc định khi load
        createRandomArray();
    </script>
</body>
</html>
