<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành 08 - Đăng ký</title>
</head>

<body>
    <div class="header" style="text-align: center;">
        <h2>BÀI KIỂM TRA CHƯƠNG 2</h2>
        <p>
            <b>Môn học: </b><i>Mạng máy tính</i>
            <br><b>Mã số sinh viên:</b> <i>2351010216</i>
            <br><b>Họ và tên: </b><i>Nguyễn Thị Tuyết Trinh</i>
        </p>
        <hr color="blue">
        <a href="bth8-index.html" target="_blank">Trang chủ</a>|
        <a href="bt08-content.html" target="_blank">Nội dung môn học</a>|
        <a href="bt08-register.html" target="_blank">Đăng ký</a>
    </div>
    <div>
        <form>
            <fieldset>
                <legend style="text-align: center;">
                    <h2>ĐĂNG KÝ THAM GIA DIỄN ĐÀN</h2>
                </legend>
            </fieldset>
            <table style="background-color: yellow;" border="1" width="55%" cellspacing="2" cellpading="10"
                align="center">
                <tbody style="text-align: left;">
                    <tr>
                        <th><label>Tên đăng nhập:</label></th>
                        <th><input type="text" name="txtTenDangNhap" placeholder="Nhập tên đăng nhập" required></th>
                    </tr>
                    <tr>
                        <th><label>Mật khẩu:</label></th>
                        <th><input type="password" name="txtMatKhau" required></th>
                    </tr>
                    <tr>
                        <th><label>Giới tính:</label></th>
                        <th><input type="radio" name="rdGioiTinh" value="Nam" checked>Nam
                            <input type="radio" name="rdGioiTinh" value="Nu">Nữ
                        </th>
                    </tr>
                    <tr>
                        <th><label>Ngày sinh:</label></th>
                        <th><input type="date" name="date" required></th>
                    </tr>
                    <tr>
                        <th><label>Email:</label></th>
                        <th><input type="email" name="txtemail" required></th>
                    </tr>
                    <tr>
                        <th><label>Ngôn ngữ lập trình yêu thích nhất</label></th>
                        <th><input type="text" name="txtnnlt" list="nnlt" required>
                            <datalist id="nnlt">
                                <option>C++</option>
                                <option>C#</option>
                                <option>PHP</option>
                                <option>Java</option>
                                <option>Python</option>
                            </datalist>
                        </th>
                    </tr>
                    <tr>
                        <th><label>Quy định khi tham gia diễn đàn</label></th>
                        <th><textarea rows="5"
                                cols="30">Bài viết phải nghiêm túc, không chứa quảng cáo, không có nội dung phản cảm</textarea>
                        </th>
                    </tr>
                    <tr>
                        <th></th>
                        <th><button type="submit">
                                <img src="/images/register-button.png" alt="submit" width="100px" height="40px" />
                            </button>
                            <button type="reset">
                                <img src="/images/cancel.png" alt="reset" width="100px" height="40px" />
                            </button>
                        </th>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
</body>

</html>
