<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body align="center">
    <div>
        <h2>Audio player</h2>
        <audio controls loop>
            <source src="./uploads/audio.m4a" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ HTML5 Audio, vui lòng truy cập link: <a
                href="./uploads/audio.m4a">audio.mp3</a>
        </audio>
    </div>
    <div>
        <h2>Video Player</h2>
        <video controls loop width="320" height="240">
            <source src="./uploads/video.mp4" type="video/mp4">
            Lưu ý: Trình duyệt của bạn phải hỗ trợ HTML5
        </video>
    </div>
    <div>
        <h2>Youtube Player</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dg4Byky2oLk?si=7-6T7DzUOd8aP3BT"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div>
        <h2>Link Map Player</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7841.528449110085!2d106.68629050254822!3d10.675400347079556!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31753100099ce9ed%3A0xdb6079801f0735ea!2sCity%20Open%20University.%20Ho%20Chi%20Minh%20(campus%203)!5e0!3m2!1sen!2s!4v1783127309047!5m2!1sen!2s"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</body>

</html>
