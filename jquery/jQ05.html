<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập jQuery 05 - Hiệu ứng Hover hình ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #7a92a5;
            background: #ffffff;
            padding: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .img-wrapper {
            width: 320px;
            height: 240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        #hoverImg {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.4s ease;
        }

        .caption {
            font-size: 13px;
            color: #555;
            margin-top: 15px;
            font-style: italic;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="img-wrapper">
            <img id="hoverImg" src="../images/html.jpg" alt="Ảnh ban đầu">
        </div>
        <div class="caption" id="captionText">Di chuyển con trỏ chuột lên hình để xem hiệu ứng</div>
    </div>

    <div style="text-align: center;">
        <a href="../jquery.html" class="back-link">← Quay lại danh mục jQuery</a>
    </div>

    <script>
        $(document).ready(function() {
            const originalSrc = "../images/html.jpg";
            const hoverSrc = "../images/javascript.jpg";

            $('#hoverImg').hover(
                // Mouse enter: đổi sang hình khác và phóng to
                function() {
                    $(this).attr('src', hoverSrc);
                    $(this).css({
                        'width': '280px',
                        'height': '210px',
                        'box-shadow': '0 8px 20px rgba(0, 0, 0, 0.3)'
                    });
                    $('#captionText').text('Khi đưa con trỏ chuột lên hình thay đổi và phóng to');
                },
                // Mouse leave: trở về hình cũ và kích thước ban đầu
                function() {
                    $(this).attr('src', originalSrc);
                    $(this).css({
                        'width': '220px',
                        'height': '160px',
                        'box-shadow': '0 2px 6px rgba(0, 0, 0, 0.15)'
                    });
                    $('#captionText').text('Di chuyển con trỏ chuột lên hình để xem hiệu ứng');
                }
            );
        });
    </script>
</body>
</html>
