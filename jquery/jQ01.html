<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập jQuery 01 - Thêm môn học</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            border: 1px solid #7a92a5;
            background: #ffffff;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-row label {
            width: 100px;
            font-size: 14px;
        }

        .input-row input {
            flex-grow: 1;
            padding: 6px 8px;
            font-size: 14px;
            border: 1px solid #aaa;
        }

        .subject-list {
            padding-left: 120px;
            margin-bottom: 20px;
        }

        .subject-list li {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .btn-add {
            margin-left: 20px;
            padding: 6px 14px;
            cursor: pointer;
            border: 1px solid #7a92a5;
            background-color: #efefef;
            border-radius: 3px;
            font-size: 13px;
        }

        .btn-add:hover {
            background-color: #e2e2e2;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="input-row">
            <label for="subjectName">Tên môn học:</label>
            <input type="text" id="subjectName" placeholder="Nhập tên môn học...">
        </div>

        <ul class="subject-list" id="subjectList">
            <li>Python</li>
            <li>PHP</li>
        </ul>

        <div>
            <button class="btn-add" id="btnAdd">Thêm môn học</button>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="../jquery.html" class="back-link">← Quay lại danh mục jQuery</a>
    </div>

    <script>
        $(document).ready(function() {
            function addSubject() {
                const name = $('#subjectName').val().trim();
                if (name !== "") {
                    $('#subjectList').append(`<li>${name}</li>`);
                    $('#subjectName').val('').focus();
                }
            }

            // Click nút Thêm môn học
            $('#btnAdd').click(function() {
                addSubject();
            });

            // Nhấn phím Enter trong ô input
            $('#subjectName').keypress(function(e) {
                if (e.which === 13) {
                    addSubject();
                }
            });
        });
    </script>
</body>
</html>
