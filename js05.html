<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập JS 05 - Chương trình xử lý chuỗi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #7a92a5;
            background: #ffffff;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .marquee-box {
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 20px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }

        .marquee-text {
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            color: #1a365d;
            animation: scrollLeft 10s linear infinite;
        }

        @keyframes scrollLeft {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .form-row label {
            width: 100px;
            font-size: 14px;
        }

        .form-row input[type="text"] {
            flex-grow: 1;
            padding: 6px 8px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        .form-row input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid #7a92a5;
            background-color: #efefef;
            border-radius: 3px;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #e2e2e2;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="marquee-box">
            <span class="marquee-text">CHƯƠNG TRÌNH XỬ LÝ CHUỖI</span>
        </div>

        <div class="form-row">
            <label for="txtS1">Chuỗi S1:</label>
            <input type="text" id="txtS1" value="Learning JAVASCRIPT is veRy easy">
        </div>

        <div class="form-row">
            <label for="txtS2">Chuỗi S2:</label>
            <input type="text" id="txtS2" value="javascript">
        </div>

        <div class="form-row">
            <label for="txtS3">Chuỗi S3:</label>
            <input type="text" id="txtS3" value="jQuery">
        </div>

        <div class="form-row">
            <label for="txtPos">Vị trí chèn:</label>
            <input type="number" id="txtPos" value="0" min="0">
        </div>

        <div class="btn-group">
            <button onclick="normalizeString()">Chuẩn hóa chuỗi</button>
            <button onclick="reverseWords()">Đảo chuỗi</button>
            <button onclick="restoreOriginal()">Khôi phục</button>
        </div>

        <div class="btn-group">
            <button onclick="replaceS2WithS3()">Thay thế S2 bằng S3</button>
            <button onclick="insertS2IntoS1()">Chèn S2 vào S1</button>
            <button onclick="deleteS2InS1()">Xóa S2 trong S1</button>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="javascript.html" class="back-link">← Quay lại danh mục JavaScript</a>
    </div>

    <script>
        const originalS1 = "Learning JAVASCRIPT is veRy easy";

        // Chuẩn hóa chuỗi: Xóa khoảng trắng thừa, viết hoa ký tự đầu mỗi từ
        function normalizeString() {
            let s1 = document.getElementById("txtS1").value.trim();
            if (!s1) return;

            let words = s1.split(/\s+/);
            let normalized = words.map(w => {
                if (!w) return "";
                return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            }).join(" ");

            document.getElementById("txtS1").value = normalized;
        }

        // Đảo các từ trong chuỗi
        function reverseWords() {
            let s1 = document.getElementById("txtS1").value.trim();
            if (!s1) return;

            let words = s1.split(/\s+/);
            document.getElementById("txtS1").value = words.reverse().join(" ");
        }

        // Thay thế S2 bằng S3 trong S1 (không phân biệt hoa thường)
        function replaceS2WithS3() {
            let s1 = document.getElementById("txtS1").value;
            let s2 = document.getElementById("txtS2").value;
            let s3 = document.getElementById("txtS3").value;

            if (!s2) {
                alert("Vui lòng nhập chuỗi S2!");
                return;
            }

            // Dùng RegExp với flag 'gi' để thay thế không phân biệt hoa thường
            let regex = new RegExp(s2.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            document.getElementById("txtS1").value = s1.replace(regex, s3);
        }

        // Chèn S2 vào S1 tại vị trí chèn
        function insertS2IntoS1() {
            let s1 = document.getElementById("txtS1").value;
            let s2 = document.getElementById("txtS2").value;
            let pos = parseInt(document.getElementById("txtPos").value);

            if (isNaN(pos) || pos < 0 || pos > s1.length) {
                alert(`Vị trí chèn không hợp lệ! Vui lòng nhập số từ 0 đến ${s1.length}`);
                return;
            }

            let result = s1.slice(0, pos) + s2 + s1.slice(pos);
            document.getElementById("txtS1").value = result;
        }

        // Xóa S2 trong S1 (không phân biệt hoa thường)
        function deleteS2InS1() {
            let s1 = document.getElementById("txtS1").value;
            let s2 = document.getElementById("txtS2").value;

            if (!s2) {
                alert("Vui lòng nhập chuỗi S2 cần xóa!");
                return;
            }

            let regex = new RegExp(s2.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            document.getElementById("txtS1").value = s1.replace(regex, '');
        }

        // Khôi phục chuỗi ban đầu
        function restoreOriginal() {
            document.getElementById("txtS1").value = originalS1;
        }
    </script>
</body>
</html>
